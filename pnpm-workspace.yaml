packages:
  - "Apps/*"
  - "packages/*"
allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  esbuild: true
  prisma: true
  unrs-resolver: true
auditConfig:
  # Upstream reports no patched release for these transitive advisories.
  # Keep them explicit so newly fixable high-severity findings still fail CI.
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
    - GHSA-86w9-cpqp-85rv
minimumReleaseAgeExclude:
  - postcss@8.5.31
overrides:
  js-yaml: 4.3.2
  lodash: 4.18.1
  multer: 2.4.0
  postcss: 8.5.31
